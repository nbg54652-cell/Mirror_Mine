const sw=(k,v)=>k=='o'?`<i class="sw" style="--c:${v[1]}"></i>`:k=='c'?`<i class="sw g" style="background:linear-gradient(${v[1]},${v[2]},${v[3]})"></i>`:k=='w'?`<i class="sw w" style="--c:${v[1]}"></i>`:`<i class="sw a" style="background:linear-gradient(135deg,${TH[v[1]][0]},${TH[v[1]][2]})"></i>`;

const DQ=[['Collect 10 crystals',10,'c',80],['Win 2 matches',2,'w',100],['Win with 3 walls or fewer',1,'l',120],['Win by exactly 1 crystal',1,'x',150]],RK=['Miner','Crystal Runner','Mirror Hunter','Mirror Master'];

function dqs(){const td=new Date().toDateString();if(!P.dq||P.dq.d!=td)P.dq={d:td,i:(Date.now()/864e5|0)%DQ.length,p:0,dn:0};return P.dq}
function chk(w,el,d,wu,cs){const t=P.tot,q=dqs(),Q=DQ[q.i];t.c+=cs;t.wl+=wu;if(w){t.w++;if(el<25)t.sp=1;if(d==-1)t.cc=1}

AH.forEach(a=>{if(!P.ach.includes(a[0])&&a[2](t)){P.ach.push(a[0]);setTimeout(()=>{fx('🏆 '+a[0],0);SF.win()},3800)}})}
